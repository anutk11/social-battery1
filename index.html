<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הסוללה החברתית שלי</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      direction: rtl;
      background-color: #f0f0f0;
      padding: 50px;
    }
    #battery {
      width: 200px;
      height: 80px;
      border: 4px solid #333;
      margin: 0 auto;
      position: relative;
      border-radius: 10px;
      background-color: white;
    }
    #battery::after {
      content: '';
      position: absolute;
      top: 25%;
      right: -12px;
      width: 10px;
      height: 50%;
      background: #333;
      border-radius: 2px;
    }
    #fill {
      height: 100%;
      width: 0%;
      border-radius: 6px 0 0 6px;
    }
    #status {
      margin-top: 20px;
      font-size: 1.5em;
    }
    #share-link {
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <h1>הסוללה החברתית שלי</h1>
  <div id="battery">
    <div id="fill"></div>
  </div>
  <p id="percent"></p>
  <p id="status">בודק מצב...</p>
  <input type="range" id="slider" min="0" max="100" value="100">
  <div id="share-link"></div>

  <script>
    const fill = document.getElementById("fill");
    const status = document.getElementById("status");
    const percentText = document.getElementById("percent");
    const slider = document.getElementById("slider");
    const shareDiv = document.getElementById("share-link");

    // הודעות משתנות בהתאם לרמת הסוללה (כל 10 אחוז)
    const messages = {
      0: "0% - אין סוללה. הלך לטעינה עצמית.",
      10: "10% - אני מדבר רק עם כלבים עכשיו.",
      20: "20% - אולי אגיד שלום, אבל בלי עין בעין.",
      30: "30% - זורק חיוכים מזויפים מרחוק.",
      40: "40% - מדבר, אבל רק אם משלמים לי בקפה.",
      50: "50% - נו טוב, אני כבר פה...",
      60: "60% - אפשר לנהל שיחה של עד 3 דקות.",
      70: "70% - יחסית סבבה! אפשר מינגלינג.",
      80: "80% - תביאו את השיחות העמוקות!",
      90: "90% - רוקד באמצע הרחוב עם זרים.",
      100: "100% - כוכב מסיבות! תרקדו איתי!"
    };

    // פונקציית עדכון תצוגת הסוללה והסטטוס
    function updateBattery(percent) {
      fill.style.width = percent + "%";
      percentText.innerText = percent + "%";
      // עדכון הצבע לפי רמת הסוללה
      if (percent < 30) {
        fill.style.backgroundColor = "#e74c3c"; // אדום
      } else if (percent < 60) {
        fill.style.backgroundColor = "#f1c40f"; // צהוב
      } else {
        fill.style.backgroundColor = "#2ecc71"; // ירוק
      }
      
      // חלוקה עשרונית: עיגול כל 10 אחוזים
      let index = Math.floor(percent / 10) * 10;
      if (index > 100) index = 100;
      status.innerText = messages[index] || "";
    }

    // עדכון קישור השיתוף עם הפרמטר battery ושמירה ב-localStorage
    function updateShareLink(value) {
      const url = new URL(window.location.href);
      url.searchParams.set("battery", value);
      // עדכון כתובת הדף בכתובת URL (ללא ריענון הדף) כדי שהקישור ישאר עדכני\n
      window.history.replaceState({}, '', url);
      shareDiv.innerHTML = `<p>שתף חברים: <a href="${url.toString()}" target="_blank">${url.toString()}</a></p>`;
      localStorage.setItem("socialBattery", value);
    }

    // מאזין לשינוי Slider
    slider.addEventListener("input", () => {
      const value = slider.value;
      updateBattery(value);
      updateShareLink(value);
    });

    // בעת טעינת הדף, נבדוק אם קיימת הגדרה ב-URL או ב-localStorage ונעדכן את מצב הסוללה בהתאם
    window.onload = () => {
      let batteryValue = new URLSearchParams(window.location.search).get("battery") || localStorage.getItem("socialBattery") || 100;
      slider.value = batteryValue;
      updateBattery(batteryValue);
      updateShareLink(batteryValue);
    };
  </script>
</body>
</html>
